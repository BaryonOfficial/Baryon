packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted
verifyDepsBeforeRun: false

minimumReleaseAgeExclude:
  - "@types/three@0.185.0"
  - "three@0.185.0"
  - "thinking-orbs@0.1.1"

blockExoticSubdeps: false

overrides:
  "extract-zip>yauzl": "3.3.1"
  "tar": "7.5.16"
  "tmp": "0.2.7"
  "ws": "8.21.0"
  "yaml": "2.9.0"

allowBuilds:
  "@ast-grep/cli": true
  "@sentry/cli": true
  "@serialport/bindings-cpp": false
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true

patchedDependencies:
  # Remove after R3F ships https://github.com/pmndrs/react-three-fiber/pull/3783.
  '@react-three/fiber@9.7.0': patches/@react-three__fiber@9.7.0.patch
