packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

minimumReleaseAgeExclude:
  - "@types/three@0.185.0"
  - "three@0.185.0"

blockExoticSubdeps: false

overrides:
  "extract-zip>yauzl": "3.3.1"
  "tar": "7.5.16"
  "tmp": "0.2.7"
  "ws": "8.21.0"
  "yaml": "2.9.0"

allowBuilds:
  "@ast-grep/cli": true
  "@sentry/cli": true
  "@serialport/bindings-cpp": false
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true
