packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

minimumReleaseAgeExclude:
  - "astro@7.0.0-beta.3"
  - "electron@42.3.3"

blockExoticSubdeps: false

overrides:
  "extract-zip>yauzl": "3.3.1"

allowBuilds:
  "@ast-grep/cli": true
  "@sentry/cli": true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  sharp: true
