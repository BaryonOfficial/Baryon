    <script>
      // The AR Lab (/ar-lab) matches the marketing site's plain white Baryon

        var path = window.location.pathname.replace(/\/+$/, "") || "/";
        if (path === "/ar-lab") {
          document
            .getElementById("app-favicon")
            .setAttribute("href", "/assets/BaryonLogoWhite.svg");
        }
      })();
    </script>
