[package]
name = "baryon-desktop"
version = "0.0.0"
description = "Baryon Desktop"
authors = []
license = "AGPL-3.0-only"
repository = "https://github.com/BaryonOfficial/Baryon"
default-run = "baryon-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "baryon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "baryon-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
