name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint packages/visualizer/src packages/app-shell/src/components/hooks

      - name: Typecheck
        run: pnpm --filter @baryon/visualizer typecheck

      - name: Unit tests
        run: pnpm --filter @baryon/visualizer test
