name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLA:
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_CLA_ASSISTANT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: "cla-signatures/signatures.json"
          path-to-document: "https://github.com/BaryonOfficial/Baryon/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: bot*,RektTillNoon
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: >
            I have read the CLA Document and I hereby sign the CLA
